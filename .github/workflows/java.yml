name: Run Sensor Simulation
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  run-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install flask

      - name: Run Transformer
        run: nohup python transformer/transformer.py &

      - name: Run Sampler
        run: nohup node sampler.js &

      - name: Compile Sensor
        run: javac sensor/Sensor.java
        
      - name: Download JUnit
        run: |
          curl -L -o junit-platform-console-standalone-1.10.2.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
      
      - name: Compile TestCases
        run: javac -cp ".:junit-platform-console-standalone-1.10.2.jar" TestCases.java
      
      - name: Run Unit Tests
        run: |
          java -jar junit-platform-console-standalone-1.10.2.jar \
            --class-path . \
            --scan-class-path \
            --include-classname '.*TestCases'   
