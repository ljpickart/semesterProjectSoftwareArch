name: Run Sensor Simulation
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  run-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Sampler
        run: nohup node sampler.js &

      - name: Compile Sensor
        run: javac Sensor.java

      - name: Compile Tests
        run: javac -cp ".:junit-platform-console-standalone.jar" TestCases.java

      - name: Run Sensor
        run: java Sensor

      - name: Run Unit Tests
        run: |
          java -jar junit-platform-console-standalone.jar \
          --class-path . \
          --scan-class-path \
          --include-classname '.*TestCases'        
